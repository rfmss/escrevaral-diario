---
layout: default
---

<article class="post">

  <header class="post-header">
    <div class="post-version">{{ page.version }}</div>
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%-d de %B de %Y" }}
    </time>
    {% if page.tags and page.tags.size > 0 %}
    <div class="post-tags">
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ site.url }}" class="back-link">← Todas as entradas</a>
  </footer>

</article>
